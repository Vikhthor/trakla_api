[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "app"
version = "0.0.1"
dependencies = [
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "ipython>=9.16.1",
    "pyjwt>=2.13.0",
    "requests>=2.34.2",
    "sqlmodel>=0.0.42",
    "python-dotenv>=1.2.3",
    "honcho>=2.0.0",
    "rq>=2.12.0",
    "schedule>=1.2.2",
    "traceback-with-variables>=2.2.1",
    "pymysql>=1.2.3",
]
[dependency-groups]
dev = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "ipython>=9.16.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlmodel>=0.0.42",
]
[tool.setuptools.packages.find]
include = ["edgefm_backend*"]
